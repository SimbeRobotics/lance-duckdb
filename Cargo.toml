[package]
name = "lance_duckdb_ffi"
version = "0.1.0"
edition = "2021"

[lib]
name = "lance_duckdb_ffi"
crate-type = ["staticlib"]
path = "rust/lib.rs"

[profile.release]
lto = "thin"
strip = true
panic = "abort"

[profile.dev]
panic = "abort"

[dependencies]

# Lance and Arrow dependencies - using compatible versions
lance = { version = "4.0.0", default-features = false, features = ["aws", "azure", "gcp", "oss", "huggingface"] }
lance-arrow = "4.0.0"
lance-core = "4.0.0"
lance-index = "4.0.0"
lance-linalg = "4.0.0"
lance-namespace = "4.0.0"
lance-namespace-impls = { version = "4.0.0", features = ["rest"] }
lance-table = "4.0.0"

arrow = { version = "57.0.0", features = ["ffi"] }
arrow-array = "57.0.0"
arrow-schema = "57.0.0"

datafusion = "52.1.0"
datafusion-common = "52.1.0"
datafusion-expr = "52.1.0"
datafusion-functions = "52.1.0"
datafusion-sql = "52.1.0"

anyhow = "1.0"
async-trait = "0.1"
bzip2-sys = { version = "0.1.13", features = ["static"] }
chrono = "0.4"
futures = "0.3"
roaring = "0.11.3"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
snafu = "0.8.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rand = "0.8"

# Patch lance crates to use SimbeRobotics fork with the merge_with_schema sliced-list fix
# backported from upstream (lance-format/lance#6581). Drop once upstream ships a
# v4.0.x patch release including the fix and lance-duckdb bumps to it.
[patch.crates-io]
lance = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
lance-arrow = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
lance-core = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
lance-datafusion = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
lance-encoding = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
lance-file = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
lance-index = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
lance-io = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
lance-linalg = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
lance-namespace = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
lance-namespace-impls = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
lance-table = { git = "https://github.com/SimbeRobotics/lance.git", branch = "release/simbe-v4-patch" }
